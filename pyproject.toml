[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "xlookpy"
version = "0.4.0"
description = "Script-driven laboratory experiment reduction and interactive plotting"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pint>=0.23", "nptdms>=1.7", "scipy>=1.10"]

[project.optional-dependencies]
gui = ["PySide6==6.8.3", "pyqtgraph==0.14.0", "qtconsole>=5.6,<6", "ipykernel>=6.29,<8"]
test = ["pytest>=8"]

[project.scripts]
xlookpy = "xlookpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
